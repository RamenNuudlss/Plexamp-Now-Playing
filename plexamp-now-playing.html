<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plexamp Now Playing</title>
<link id="fonts" rel="stylesheet" href="">
<!-- config.js is written by the OBS script next to this file. Missing is fine. -->
<script src="config.js"></script>
<style>
/* ===================== base: page + stage ===================== */
@property --bg1 { syntax: "<color>"; inherits: true; initial-value: #3a2350; }
@property --bg2 { syntax: "<color>"; inherits: true; initial-value: #1d3352; }
@property --bg3 { syntax: "<color>"; inherits: true; initial-value: #41213a; }
@property --bg4 { syntax: "<color>"; inherits: true; initial-value: #16242f; }
@property --accent { syntax: "<color>"; inherits: true; initial-value: #e5a00d; }
:root { transition: --bg1 1.3s ease, --bg2 1.3s ease, --bg3 1.3s ease, --bg4 1.3s ease, --accent 1.3s ease; }
:root {
  --ease: cubic-bezier(.22, 1, .36, 1);
  --ease-in: cubic-bezier(.55, 0, .75, .4);
  --spring: cubic-bezier(.34, 1.56, .64, 1);
  --fs: 1;
  --r: 18px;
  --art-r: 10px;
  --ink: #fff;
  --ink-2: rgba(255,255,255,.78);
  --ink-3: rgba(255,255,255,.55);
  --accent: #e5a00d;
  --accent-ink: #1a1206;
  --accent-soft: rgba(229,160,13,.22);
  --bg1: #3a2350; --bg2: #1d3352; --bg3: #41213a; --bg4: #16242f;
  --al1: #6b3f8f; --al2: #33598f; --al3: #7a3e6b; --al4: #2a4354;
  --panel: #1b1b2a;
  --level: 0;
  --beat: 0;
  --p: 0;
  --font-title: system-ui, "Segoe UI", sans-serif;
  --font-body: system-ui, "Segoe UI", sans-serif;
  --card-opacity: 1;
}
html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
body { color: var(--ink); font-family: var(--font-body); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
#root { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#stage { position: absolute; inset: 0; transition: opacity .55s var(--ease), transform .75s var(--ease), filter .6s var(--ease), clip-path .7s var(--ease); will-change: transform, opacity; }
.th { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
.th * { box-sizing: border-box; }
.case-upper .tcase { text-transform: uppercase; }
.case-lower .tcase { text-transform: lowercase; }

/* ===================== show / hide (enter) ===================== */
#stage.is-hidden { opacity: 0; pointer-events: none; }
.en-slide-left  #stage.is-hidden { transform: translateX(-70px); }
.en-slide-right #stage.is-hidden { transform: translateX(70px); }
.en-slide-up    #stage.is-hidden { transform: translateY(50px); }
.en-slide-down  #stage.is-hidden { transform: translateY(-50px); }
.en-zoom        #stage.is-hidden { transform: scale(.82); }
.en-pop         #stage.is-hidden { transform: scale(.6); }
.en-pop         #stage { transition: opacity .35s var(--ease), transform .6s var(--spring); }
.en-drop        #stage.is-hidden { transform: translateY(-120px) rotate(-3deg); }
.en-drop        #stage { transition: opacity .35s ease, transform .9s cubic-bezier(.3, 1.45, .5, 1); }
.en-blur        #stage.is-hidden { filter: blur(18px); transform: scale(1.04); }
.en-wipe        #stage { clip-path: inset(0 0 0 0); }
.en-wipe        #stage.is-hidden { clip-path: inset(0 100% 0 0); opacity: 1; }
.en-flip        #stage.is-hidden { transform: perspective(900px) rotateX(80deg); }
.en-none        #stage, .en-none #stage.is-hidden { transition: opacity .25s; transform: none; }
.no-anim #stage, .no-anim #stage * { transition: none !important; }

/* ===================== swap (song change) ===================== */
.swap { transition: opacity .32s ease, transform .4s var(--ease), filter .4s ease, clip-path .45s var(--ease); transition-delay: calc(var(--i, 0) * 45ms); }
.ch-slide .swap.out  { opacity: 0; transform: translateY(-10px); }
.ch-slide .swap.prep { opacity: 0; transform: translateY(12px); transition: none; }
.ch-rise  .swap.out  { opacity: 0; transform: translateY(-4px); }
.ch-rise  .swap.prep { opacity: 0; transform: translateY(26px); transition: none; }
.ch-rise  .swap      { transition-duration: .3s, .6s; transition-delay: calc(var(--i, 0) * 90ms); }
.ch-fade  .swap.out, .ch-fade .swap.prep { opacity: 0; }
.ch-fade  .swap.prep { transition: none; }
.ch-zoom  .swap.out  { opacity: 0; transform: scale(.92); }
.ch-zoom  .swap.prep { opacity: 0; transform: scale(1.08); transition: none; }
.ch-blur  .swap.out  { opacity: 0; filter: blur(8px); }
.ch-blur  .swap.prep { opacity: 0; filter: blur(8px); transition: none; }
.ch-wipe  .swap      { clip-path: inset(0 0 0 0); }
.ch-wipe  .swap.out  { clip-path: inset(0 0 0 100%); }
.ch-wipe  .swap.prep { clip-path: inset(0 100% 0 0); transition: none; }
.ch-flip  [data-art].flip-out  { transform: perspective(700px) rotateY(88deg); transition: transform .28s var(--ease-in); }
.ch-flip  [data-art].flip-prep { transform: perspective(700px) rotateY(-88deg); transition: none; }
.ch-flip  .swap.out { opacity: 0; }
.ch-flip  .swap.prep { opacity: 0; transition: none; }

/* ===================== shared card background ===================== */
.g-bg { position: absolute; inset: 0; z-index: 0; border-radius: inherit; overflow: hidden; pointer-events: none; }
.g-bg > div { position: absolute; inset: 0; }
.g-bg .bg-mesh {
  inset: -12%;
  background:
    radial-gradient(at 0% 0%, var(--bg1) 0, transparent 62%),
    radial-gradient(at 100% 0%, var(--bg2) 0, transparent 62%),
    radial-gradient(at 100% 100%, var(--bg3) 0, transparent 62%),
    radial-gradient(at 0% 100%, var(--bg4) 0, transparent 62%),
    linear-gradient(135deg, var(--bg1), var(--bg3));
  filter: blur(18px) saturate(1.15);
}
.g-bg .bg-art { inset: -25%; background-size: cover; background-position: center; filter: blur(30px) saturate(1.5) brightness(.6); }
.g-bg .bg-scrim { background: linear-gradient(100deg, rgba(0,0,0,.42), rgba(0,0,0,.16) 70%, rgba(0,0,0,.24)); }
.g-bg .bg-grain { opacity: .07; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
.g-bg .bg-glass { background: linear-gradient(160deg, rgba(40,40,52,.78), rgba(14,14,20,.84)); }
.g-bg .bg-glass::after { content: ""; position: absolute; inset: 0; background: linear-gradient(100deg, rgba(255,255,255,.07), transparent 45%); }
.g-bg .bg-solid { background: var(--panel); }
.g-bg .bg-grad { background: linear-gradient(125deg, var(--bg1), var(--bg2) 55%, var(--bg3)); }
.g-bg .bg-edge { border-radius: inherit; box-shadow: inset 0 0 0 1px rgba(255,255,255,.07), inset 0 1px 0 rgba(255,255,255,.08); }
.g-bg.bg-none .bg-edge { display: none; }

/* ===================== album art ===================== */
[data-art] { position: relative; overflow: hidden; border-radius: var(--art-r); background: rgba(127,127,127,.18); transition: transform .5s var(--ease), border-radius .4s var(--ease); }
[data-art] > img.a-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .7s ease, filter .6s ease; display: block; }
[data-art] > img.a-img.on { opacity: 1; }
.is-paused [data-art] > img.a-img { filter: saturate(.55) brightness(.8); }
.art-hidden [data-art], .art-hidden .art-slot { display: none !important; }
.pg-ring { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
.pg-ring circle { fill: none; stroke-width: 3; }
.pg-ring .ring-bg { stroke: rgba(255,255,255,.18); }
.pg-ring .ring-fg { stroke: var(--accent); stroke-linecap: round; }

/* art motion */
.am-float [data-art] { animation: amFloat 6s ease-in-out infinite; }
@keyframes amFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.am-tilt [data-art] { animation: amTilt 9s ease-in-out infinite; }
@keyframes amTilt { 0%, 100% { transform: perspective(500px) rotateY(-9deg) rotateX(4deg); } 50% { transform: perspective(500px) rotateY(9deg) rotateX(-3deg); } }
.am-pulse [data-art] { transform: scale(calc(1 + var(--beat) * .07 + var(--level) * .02)); transition: border-radius .4s; }
.am-spin [data-art] { border-radius: 50% !important; animation: amSpin 14s linear infinite; }
.am-spin.is-paused [data-art], .is-paused .am-spin [data-art] { animation-play-state: paused; }
@keyframes amSpin { to { transform: rotate(360deg); } }
.am-breathe [data-art] { box-shadow: 0 0 calc(8px + var(--level) * 30px) calc(var(--beat) * 6px) var(--accent-soft), 0 10px 24px -8px rgba(0,0,0,.6); }

/* ===================== text helpers ===================== */
.line { white-space: nowrap; overflow: hidden; }
.line > span { display: inline-block; will-change: transform; }
.line.is-masked { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 24px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 24px), transparent); }
.line > span.is-scrolling { animation: marquee var(--dur, 8s) ease-in-out 2.5s infinite alternate; }
@keyframes marquee { 0%, 14% { transform: translateX(0); } 86%, 100% { transform: translateX(var(--dist)); } }
.mq-off .line > span.is-scrolling { animation: none; }
.mq-off .line.is-masked { -webkit-mask-image: none; mask-image: none; }
.mq-off .line > span { display: inline; }
.mq-off .line { text-overflow: ellipsis; }
.hide-album [data-show~="album"], .hide-year [data-show~="year"], .hide-quality [data-show~="quality"],
.hide-times [data-show~="times"], .hide-eq [data-show~="eq"], .hide-genre [data-show~="genre"],
.hide-device [data-show~="device"], .hide-rating [data-show~="rating"], .hide-plays [data-show~="plays"],
.hide-label [data-show~="label"], .hide-progress [data-show~="progress"] { display: none !important; }
[data-b]:empty[data-hide-empty] { display: none !important; }

/* text effects */
.tfx-ch { display: inline-block; white-space: pre; }
.tfx-wave .tfx-ch { animation: tfxWave .6s var(--spring) both; animation-delay: calc(var(--ci) * 28ms); }
@keyframes tfxWave { from { opacity: 0; transform: translateY(.6em) scale(.9); } }
.tfx-blur .tfx-ch { animation: tfxBlur .7s ease both; animation-delay: calc(var(--ci) * 22ms); }
@keyframes tfxBlur { from { opacity: 0; filter: blur(6px); } }
.tfx-glitch { animation: tfxGlitch .7s steps(1) both; }
@keyframes tfxGlitch {
  0% { text-shadow: 3px 0 #ff2a6d, -3px 0 #05d9e8; transform: translateX(3px) skewX(-8deg); clip-path: inset(10% 0 55% 0); }
  15% { transform: translateX(-4px); clip-path: inset(60% 0 5% 0); }
  30% { transform: translateX(2px) skewX(6deg); clip-path: inset(30% 0 30% 0); }
  45% { transform: none; clip-path: inset(0 0 0 0); text-shadow: 2px 0 #ff2a6d, -2px 0 #05d9e8; }
  60% { transform: translateX(-1px); text-shadow: 1px 0 #ff2a6d, -1px 0 #05d9e8; }
  100% { transform: none; text-shadow: none; clip-path: none; }
}
.tw-caret::after { content: ""; display: inline-block; width: .5em; height: 1em; margin-left: 2px; vertical-align: -.12em; background: currentColor; animation: caret .8s steps(1) infinite; }
@keyframes caret { 50% { opacity: 0; } }

/* ===================== mini eq ===================== */
[data-eq] { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; width: 18px; flex: none; }
[data-eq] i { display: block; flex: 1; height: 100%; border-radius: 1.5px; background: var(--accent); transform-origin: bottom; animation: eq 1s ease-in-out infinite alternate; }
[data-eq] i:nth-child(1) { animation-duration: .82s; }
[data-eq] i:nth-child(2) { animation-duration: 1.13s; animation-delay: -.4s; }
[data-eq] i:nth-child(3) { animation-duration: .71s; animation-delay: -.2s; }
[data-eq] i:nth-child(4) { animation-duration: .97s; animation-delay: -.6s; }
[data-eq].live i { animation: none; transition: transform .09s linear; }
@keyframes eq { 0% { transform: scaleY(.22); } 100% { transform: scaleY(1); } }
.is-paused [data-eq] i { animation: none; transform: scaleY(.18) !important; }

/* ===================== progress ===================== */
[data-progress] { position: relative; }
.pg-bar { position: relative; height: 4px; border-radius: 2px; background: rgba(255,255,255,.17); overflow: hidden; }
.pg-bar > i, .pg-line > i { position: absolute; inset: 0; background: var(--accent); transform-origin: 0 50%; transform: scaleX(var(--p)); border-radius: inherit; }
.pg-line { position: relative; height: 2px; background: rgba(255,255,255,.14); overflow: hidden; }
.pg-wave { display: block; width: 100%; height: 30px; }
.pg-dots { display: flex; gap: 4px; align-items: center; height: 8px; }
.pg-dots > i { flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,.16); transition: background .3s; }
.pg-dots > i.on { background: var(--accent); }
.pg-blocks { display: flex; gap: 2px; height: 8px; }
.pg-blocks > i { flex: 1; background: rgba(255,255,255,.1); }
.pg-blocks > i.on { background: var(--accent); box-shadow: 0 0 6px var(--accent-soft); }
.pg-times { display: flex; justify-content: space-between; margin-top: 6px; font-size: calc(11.5px * var(--fs)); font-variant-numeric: tabular-nums; color: var(--ink-3); }

/* ===================== loudness visualizer ===================== */
[data-viz] { position: relative; }
[data-viz] canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.viz-none [data-viz]:not([data-viz-force]) { display: none; }

/* ===================== lyrics line ===================== */
.g-lyric { font-size: calc(14px * var(--fs)); line-height: 1.3; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 1.3em; }
.ly-karaoke .k-fill {
  background: linear-gradient(90deg, var(--accent) 0 calc(var(--k, 0) * 100%), var(--ink-3) calc(var(--k, 0) * 100%) 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}

/* ===================== ambient backgrounds ===================== */
[data-ambient] { position: absolute; inset: 0; overflow: hidden; pointer-events: none; border-radius: inherit; }
[data-ambient] > * { position: absolute; }
.amb-flow { inset: -60%; background: conic-gradient(from 0deg, var(--bg1), var(--bg2), var(--bg3), var(--bg4), var(--bg1)); filter: blur(30px); animation: ambSpin 28s linear infinite; opacity: .95; }
@keyframes ambSpin { to { transform: rotate(360deg); } }
.amb-blob { width: 70%; height: 140%; border-radius: 50%; filter: blur(40px); mix-blend-mode: screen; opacity: .55; animation: ambDrift 18s ease-in-out infinite alternate; }
.amb-blob.b1 { left: -20%; top: -40%; background: var(--al1); }
.amb-blob.b2 { right: -25%; top: -30%; background: var(--accent); animation-duration: 23s; animation-delay: -6s; opacity: .35; }
.amb-blob.b3 { left: 20%; bottom: -70%; background: var(--al2); animation-duration: 27s; animation-delay: -12s; }
@keyframes ambDrift { 0% { transform: translate(0, 0) scale(1); } 50% { transform: translate(18%, 10%) scale(1.15); } 100% { transform: translate(-10%, -6%) scale(.92); } }
.amb-bokeh { border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--accent) 70%, #fff) 0, transparent 68%); opacity: .0; animation: bokeh var(--d, 9s) ease-in-out infinite; animation-delay: var(--dl, 0s); }
@keyframes bokeh { 0%, 100% { opacity: 0; transform: translate(0, 0) scale(.8); } 40%, 60% { opacity: var(--o, .35); } 100% { transform: translate(var(--tx, 20px), var(--ty, -30px)) scale(1.1); } }
.amb-canvas { inset: 0; width: 100%; height: 100%; }
.amb-waves { left: 0; right: 0; bottom: 0; height: 70%; }
.amb-waves svg { position: absolute; left: 0; bottom: 0; width: 200%; height: 100%; animation: waveSlide var(--d, 12s) linear infinite; }
.amb-waves svg path { fill: var(--accent); }
@keyframes waveSlide { to { transform: translateX(-50%); } }
.amb-grid { left: -50%; right: -50%; bottom: -10%; height: 70%; transform-origin: 50% 100%; transform: perspective(160px) rotateX(58deg);
  background-image: linear-gradient(var(--accent) 1px, transparent 1px), linear-gradient(90deg, var(--accent) 1px, transparent 1px);
  background-size: 38px 38px; opacity: .35; animation: gridMove 1.6s linear infinite;
  -webkit-mask-image: linear-gradient(to top, #000 10%, transparent 95%); mask-image: linear-gradient(to top, #000 10%, transparent 95%); }
@keyframes gridMove { to { background-position: 0 38px; } }
.is-paused .amb-grid, .is-paused .amb-flow, .is-paused .amb-waves svg { animation-play-state: paused; }

/* ===================== effect overlays ===================== */
[data-fx] { position: absolute; inset: 0; z-index: 20; pointer-events: none; border-radius: inherit; overflow: hidden; }
[data-fx] > * { position: absolute; inset: 0; border-radius: inherit; }
.fx-scan { background: repeating-linear-gradient(0deg, rgba(0,0,0,.24) 0 1px, transparent 1px 3px); }
.fx-track { height: 18%; top: -20%; bottom: auto !important; background: linear-gradient(180deg, transparent, rgba(255,255,255,.08), transparent); animation: fxTrack 7s linear infinite; border-radius: 0 !important; }
@keyframes fxTrack { to { top: 110%; } }
.ef-vhs .tcase, .ef-vhs .vhs-txt { text-shadow: 1.4px 0 rgba(255, 40, 90, .55), -1.4px 0 rgba(40, 220, 255, .55); }
.ef-vhs .th { animation: fxJitter 6s steps(1) infinite; }
@keyframes fxJitter { 0%, 96%, 100% { transform: none; } 96.5% { transform: translateX(1.5px) skewX(-1.5deg); } 97.5% { transform: translateX(-2px); } 98.5% { transform: translateX(1px); } }
.fx-grain { inset: -50% !important; opacity: .2; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='1.1' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23g)'/></svg>");
  animation: fxGrain .6s steps(5) infinite; }
@keyframes fxGrain { 0% { transform: translate(0,0); } 20% { transform: translate(-6%,4%); } 40% { transform: translate(5%,-7%); } 60% { transform: translate(-3%,8%); } 80% { transform: translate(7%,2%); } }
.fx-vig { background: radial-gradient(ellipse at center, transparent 50%, rgba(10,6,0,.55) 100%); }
.fx-tone { background: rgba(255,170,80,.08); mix-blend-mode: soft-light; animation: fxFlicker 3.2s steps(1) infinite; }
@keyframes fxFlicker { 0%, 100% { opacity: 1; } 31% { opacity: .5; } 33% { opacity: 1; } 71% { opacity: .75; } 72% { opacity: 1; } }
.ef-film [data-art] img { filter: sepia(.2) contrast(1.06); }
.fx-rgb { opacity: .07; background: repeating-linear-gradient(90deg, #f00 0 1px, #0f0 1px 2px, #00f 2px 3px); }
.ef-crt .tcase { text-shadow: 0 0 6px rgba(255,255,255,.35); }
.fx-curve { box-shadow: inset 0 0 40px rgba(0,0,0,.55), inset 0 0 6px rgba(0,0,0,.6); }
.fx-holo { background: linear-gradient(115deg, transparent 20%, rgba(255,0,170,.25) 35%, rgba(0,255,234,.25) 45%, rgba(255,247,0,.22) 55%, transparent 70%);
  background-size: 300% 100%; mix-blend-mode: color-dodge; animation: fxHolo 6s ease-in-out infinite alternate; opacity: .8; }
@keyframes fxHolo { from { background-position: 100% 0; } to { background-position: 0 0; } }
.ef-chromatic .tcase { text-shadow: 2px 0 rgba(255,0,80,.6), -2px 0 rgba(0,200,255,.6); }
.ef-chromatic [data-art] { box-shadow: 3px 0 0 rgba(255,0,80,.45), -3px 0 0 rgba(0,200,255,.45); }
.ef-glow .fx-glowring { box-shadow: inset 0 0 0 1px var(--accent-soft), inset 0 0 calc(18px + var(--level) * 20px) var(--accent-soft); }
.ef-glow .th-card { box-shadow: 0 0 0 1px var(--accent-soft), 0 0 calc(30px + var(--level) * 30px) -6px var(--accent), 0 22px 44px -18px rgba(0,0,0,.6) !important; }
.ef-noir .th { filter: grayscale(1) contrast(1.12); }

/* ===================== setup messages ===================== */
#diag {
  position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%); z-index: 100;
  max-width: calc(100% - 24px); box-sizing: border-box;
  font: 500 12.5px/1.35 system-ui, "Segoe UI", sans-serif; color: #fff;
  background: rgba(16, 16, 24, .92); padding: 8px 12px 8px 11px; border-radius: 9px;
  border-left: 3px solid #e5a00d; box-shadow: 0 8px 20px rgba(0,0,0,.4);
  opacity: 0; transition: opacity .3s; pointer-events: none;
}
#diag.is-on { opacity: 1; }
#diag.is-error { border-left-color: #ff5d5d; }

@media (prefers-reduced-motion: reduce) {
  [data-eq] i, .line > span.is-scrolling, [data-fx] *, [data-ambient] * { animation: none !important; }
}

</style>
<style id="theme-css"></style>
</head>
<body>
<div id="root"><div id="stage" class="is-hidden"></div><div id="diag"></div></div>
<script>
/* Plexamp Now Playing — engine v2
   Themes register with PNP.defineTheme({...}) (the theme scripts are further down this file). */
(() => {
"use strict";

const PNP = window.PNP = window.PNP || {};
PNP.version = "2.0.0";
const THEMES = PNP.THEMES = {};
const ORDER = PNP.ORDER = [];
PNP.defineTheme = (t) => { THEMES[t.id] = t; if (!ORDER.includes(t.id)) ORDER.push(t.id); };

/* ============================== utilities ============================== */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const now = () => performance.now();
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function fmt(ms) {

  init(el, api) { el._openUntil = 0; el._isl = el.querySelector(".isl"); },
  track(el, api, how) {
    if (how !== "refresh") el._openUntil = api.now() + 9000;
  },
  signature(el, api, done) {
    const isl = el.querySelector(".isl");
    const wasOpen = isl.classList.contains("open");
    el._openUntil = api.now() + 9000;
    const swaps = el.querySelectorAll(".swap");
    if (wasOpen) swaps.forEach((s) => s.classList.add("out"));
    setTimeout(() => {
      api.renderStatic(); api.setArt(false);
      swaps.forEach((s) => { s.classList.remove("out"); s.classList.add("prep"); });
      void el.offsetWidth;
      requestAnimationFrame(() => { swaps.forEach((s) => s.classList.remove("prep")); done(); });
    }, wasOpen ? 330 : 0);
  },
  frame(el, api) {
    const v = api.style.variant; const isl = el._isl; if (!isl) return;
    const open = v === "open" || (v === "auto" && (api.now() < el._openUntil || !api.playing));
    if (v === "compact") { if (isl.classList.contains("open")) isl.classList.remove("open"); return; }
    if (isl.classList.contains("open") !== open) { isl.classList.toggle("open", open); setTimeout(api.updateMarquees, 750); }
  }
});

    track(el, api, how) {

(() => {
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  function items(api, n) {
    const h = api.history.slice();
    const t = api.t;
    if (t && (!h.length || h[h.length - 1].title !== t.title)) h.push({ title: t.title, artist: t.artist, duration: t.duration, quality: t.quality.text });
    return h.slice(-n);
  }
  function render(el, api, fresh) {
    const n = api.style.variant === "long" ? 8 : 4;
    const list = items(api, n);
    const box = el.querySelector(".rc-items");
    box.innerHTML = list.map((it, i) => {
      const now = i === list.length - 1;
      return `<div class="rc-item${now ? " rc-cur" : ""}${now && fresh ? " printing" : ""}">
        <div class="rc-l1"><span class="rc-q">${now ? "&#9654;" : "1"}</span><span class="rc-name tcase">${esc(it.title)}</span><span class="rc-t">${api.fmt(it.duration)}</span></div>
        <div class="rc-l2 tcase">${esc(it.artist)}</div>
      </div>`;
    }).join("");
    const total = list.reduce((a, it) => a + (it.duration || 0), 0);
    el.querySelector(".rc-count").textContent = String(list.length);
    el.querySelector(".rc-total").textContent = api.fmt(total);
    const seed = api.hash32(list.map((x) => x.title).join("|"));
    let x = 0, s = "", r = api.mulberry(seed);
    while (x < 200) { const bw = 1 + Math.floor(r() * 3); if (r() > .4) s += `<rect x="${x}" y="0" width="${bw}" height="40"/>`; x += bw + 1 + Math.floor(r() * 2); }
    el.querySelector(".rc-bar").innerHTML = `<svg viewBox="0 0 200 40" preserveAspectRatio="none">${s}</svg>`;
    el.querySelector(".rc-code").textContent = String(seed % 100000000).padStart(8, "0").replace(/(\d{4})(\d{4})/, "$1 $2");
  }
  PNP.defineTheme({
    id: "receipt",
    name: "Receipt",
    group: "Physical media",
    blurb: "A thermal-printer receipt of what you've been playing. Each new song prints a line and feeds the paper.",
    size: [380, 600],
    sizes: { long: [380, 800] },
    radius: 0,
    fonts: { title: "Courier Prime" },
    variants: [["thermal", "Thermal paper"], ["faded", "Old and faded"], ["long", "Long receipt"]],
    defaults: { colors: "album", enter: "slide-up", change: "signature", progress: "none", textCase: "upper" },
    supports: { background: false, ambient: false, effect: true, progress: false, viz: false, art: false },
    html: () => `
      <div class="rc">
        <div class="rc-paper">
          <div class="rc-head">
            <div class="rc-store"><span class="rc-lbl" data-b="label" data-show="label"></span><span class="rc-def">The Listening Room</span></div>
            <div class="rc-sub">Listening log</div>
            <div class="rc-meta"><span data-b="dateShort"></span><span data-b="clock"></span></div>
          </div>
          <div class="rc-rule"></div>
          <div class="rc-cols"><span>Qty</span><span>Item</span><span>Time</span></div>
          <div class="rc-items"></div>
          <div class="rc-rule"></div>
          <div class="rc-row rc-play"><span data-b="status"></span><span class="rc-ascii"></span></div>
          <div class="rc-row"><span>Elapsed</span><span><span data-b="elapsed"></span> / <span data-b="duration"></span></span></div>
          <div class="rc-row" data-show="quality"><span>Format</span><span data-b="quality"></span></div>
          <div class="rc-row" data-show="album"><span>Album</span><span class="rc-ell" data-b="album"></span></div>
          <div class="rc-rule"></div>
          <div class="rc-row rc-big"><span>Items</span><span class="rc-count"></span></div>
          <div class="rc-row rc-big"><span>Total time</span><span class="rc-total"></span></div>
          <div class="rc-rule"></div>
          <div class="rc-bar"></div>
          <div class="rc-code"></div>
          <div class="rc-thanks">Thank you for listening</div>
        </div>
        <div data-fx></div>
      </div>`,
    css: `

  -webkit-mask: linear-gradient(#000, #000) center / 100% calc(100% - 16px) no-repeat, conic-gradient(from 135deg at top, #000 90deg, transparent 0) top / 14px 8px repeat-x, conic-gradient(from -45deg at bottom, #000 90deg, transparent 0) bottom / 14px 8px repeat-x;

.th-receipt .rc-play { font-weight: 700; }
.th-receipt .rc-ascii { letter-spacing: -1px; }
.th-receipt .rc-big { font-size: calc(15px * var(--fs)); font-weight: 700; }
.th-receipt .rc-bar { height: 44px; margin: 6px 20px 2px; }
.th-receipt .rc-bar svg { width: 100%; height: 100%; display: block; fill: currentColor; }
.th-receipt .rc-code { text-align: center; letter-spacing: .3em; font-size: calc(12px * var(--fs)); }
.th-receipt .rc-thanks { text-align: center; margin-top: 10px; text-transform: uppercase; letter-spacing: .1em; font-weight: 700; }
.th-receipt .rc.feeding .rc-paper { animation: rcFeed 1.1s steps(9) both; }
@keyframes rcFeed { from { transform: translateY(36px); } to { transform: none; } }
`,
    track(el, api, how) { render(el, api, how === "first"); },
    enrich(el, api) { render(el, api, false); },
    signature(el, api, done) {
      api.renderStatic();
      render(el, api, true);
      const rc = el.querySelector(".rc"); rc.classList.remove("feeding"); void rc.offsetWidth; rc.classList.add("feeding");
      setTimeout(() => { rc.classList.remove("feeding"); done(); }, 1150);
    },
    frame(el, api) {
      const n = 14, k = Math.round(api.p * n);
      if (el._k === k) return; el._k = k;
      el.querySelector(".rc-ascii").textContent = "#".repeat(k) + ".".repeat(n - k);
    }
  });
})();


/* ---- 13-retroamp.js ---- */
(() => {
  // seven-segment digits: a b c d e f g
  const SEG = { "0": "abcdef", "1": "bc", "2": "abdeg", "3": "abcdg", "4": "bcfg", "5": "acdfg", "6": "acdefg", "7": "abc", "8": "abcdefg", "9": "abcdfg", "-": "g", " ": "" };
  const P = {
    a: "2,1 10,1 8.5,2.6 3.5,2.6", b: "10.4,1.4 10.4,9.4 8.8,8.2 8.8,2.9", c: "10.4,10.6 10.4,18.6 8.8,17.1 8.8,11.8",
    d: "2,19 10,19 8.5,17.4 3.5,17.4", e: "1.6,10.6 1.6,18.6 3.2,17.1 3.2,11.8", f: "1.6,1.4 1.6,9.4 3.2,8.2 3.2,2.9", g: "2.4,10 3.6,9.1 8.4,9.1 9.6,10 8.4,10.9 3.6,10.9"
  };
  function seven(str) {
    let x = 0, out = "";
    for (const ch of str) {
      if (ch === ":") { out += `<circle cx="${x + 2}" cy="6.5" r="1.2" class="on"/><circle cx="${x + 2}" cy="13.5" r="1.2" class="on"/>`; x += 5; continue; }
      const on = SEG[ch] || "";
      for (const s of "abcdefg") out += `<polygon points="${P[s].split(" ").map((p) => { const [a, b] = p.split(","); return (+a + x) + "," + b; }).join(" ")}" class="${on.includes(s) ? "on" : "off"}"/>`;
      x += 13;
    }
    return `<svg viewBox="0 0 ${x} 20" style="width:${x * 2.3}px;height:46px">${out}</svg>`;
  }

    id: "retroamp",

    supports: { background: false, ambient: false, effect: true, progress: false, viz: false, art: true },
    palette: (v, album) => ({ classic: { accent: "#3dff7a" }, midnight: { accent: "#5cc8ff" }, gold: { accent: "#ffd36a" }, album: { accent: album.accent } }[v] || { accent: "#3dff7a" }),
    html: () => `
      <div class="ra">
        <div class="ra-bar"><span class="ra-grip"></span><span class="ra-name"><span data-b="label" data-show="label"></span><span class="ra-def">Plexamp</span></span><span class="ra-grip"></span><i class="ra-wb"></i><i class="ra-wb"></i><i class="ra-wb x"></i></div>
        <div class="ra-body">
          <div class="ra-lcd">
            <div class="ra-state"><span class="ra-play">▶</span><span class="ra-pause">❚❚</span></div>
            <div class="ra-time"></div>
            <div class="ra-spec" data-viz="blocks" data-viz-force></div>
            <div class="ra-stereo"><span class="ra-mono">mono</span><span class="ra-st">stereo</span></div>
          </div>
          <div class="ra-art art-slot"><div data-art data-noring></div></div>
          <div class="ra-right">
            <div class="ra-marq"><div class="ra-mq"><span class="ra-mq1"></span><span class="ra-mq2"></span></div></div>
            <div class="ra-info">
              <span class="ra-box"><b data-b="kbps"></b><i>kbps</i></span>
              <span class="ra-box"><b data-b="khz"></b><i>kHz</i></span>
              <span class="ra-codec" data-b="codec"></span>
              <span class="ra-gap"></span>

(() => {
  function fit(el, api) {
    // shrink the current line until it fits on one line (down to 62%)
    const box = el._ly.curBox, txt = el._ly.cur;
    txt.style.fontSize = "";
    if (api.style.variant === "single") return;
    requestAnimationFrame(() => {
      const avail = box.clientWidth, need = txt.scrollWidth;
      if (avail > 0 && need > avail) txt.style.fontSize = "calc(" + (box.dataset.base || 40) + "px * var(--fs) * " + Math.max(.62, avail / need * .98).toFixed(3) + ")";
    });
  }
  function fill(el, api, st, animate) {
    const lines = el._ly; if (!lines) return;
    const box = el.querySelector(".ly");
    if (!st || !st.L) {
      const t = api.t;
      box.classList.add("no-ly");
      lines.prev.textContent = ""; lines.cur.textContent = t ? t.title : ""; lines.next.textContent = t ? t.artist : "";
      fit(el, api); return;
    }
    box.classList.remove("no-ly");
    const L = st.L;
    if (!L.timed) { lines.prev.textContent = ""; lines.cur.textContent = L.lines[0] ? L.lines[0].text : ""; lines.next.textContent = L.lines[1] ? L.lines[1].text : ""; fit(el, api); return; }
    const at = (d) => { const l = L.lines[st.idx + d]; return l ? (l.text || "♪") : (d === 0 && st.idx < 0 ? "♪" : ""); };
    lines.prev.textContent = at(-1); lines.cur.textContent = at(0); lines.next.textContent = at(1);
    fit(el, api);
    if (animate) { const wrap = el.querySelector(".ly-lines"); wrap.classList.remove("shift"); void wrap.offsetWidth; wrap.classList.add("shift"); }
  }
  PNP.defineTheme({
    id: "lyrics",
    name: "Lyrics",
    group: "Karaoke",
    blurb: "Synced lyrics from your Plex server, with each line filling in as it's sung. Without lyrics it shows the song.",
    size: [920, 300],
    sizes: { subtitle: [920, 150] },
    radius: 18,
    fonts: { title: "Bricolage Grotesque" },
    variants: [["karaoke", "Three lines"], ["single", "One big line"], ["subtitle", "TV subtitles"]],
    defaults: { colors: "album", background: "none", enter: "fade", change: "fade", progress: "line", lyrics: "karaoke", artShape: "rounded" },
    supports: { background: true, ambient: true, effect: true, progress: true, viz: false, art: true },
    html: () => `
      <div class="th-card ly">
        <div data-bg></div>
        <div data-ambient class="ly-amb"></div>
        <div class="ly-lines">
          <div class="ly-l ly-prev"></div>
          <div class="ly-l ly-cur"><span class="ly-curt k-fill"></span></div>
          <div class="ly-l ly-next"></div>
        </div>
        <div class="ly-foot swap">
          <div class="ly-art art-slot"><div data-art data-noring></div></div>
          <div class="ly-who"><span class="line ly-t tcase" data-b="title"><span></span></span><span class="line ly-a tcase" data-b="artist"><span></span></span></div>
          <span data-eq data-show="eq"></span>
          <div class="ly-pg" data-show="progress"><div data-progress></div></div>
          <span class="ly-time" data-show="times"><span data-b="elapsed"></span></span>
        </div>
        <div data-fx></div>
      </div>`,
    css: `
.th-lyrics .ly { position: relative; width: 880px; height: 260px; border-radius: var(--r); overflow: hidden; opacity: var(--card-opacity); font-family: var(--font-title); }
.th-lyrics .ly-amb { z-index: 1; }
.bgm-none .th-lyrics .ly { overflow: visible; }
.bgm-none .th-lyrics .ly-l, .bgm-none .th-lyrics .ly-foot { filter: drop-shadow(0 2px 6px rgba(0,0,0,.75)) drop-shadow(0 0 1px rgba(0,0,0,.6)); }
.bgm-none .th-lyrics .ly-prev, .bgm-none .th-lyrics .ly-next { color: var(--ink-2); }
.th-lyrics .ly-lines { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; height: 196px; padding: 0 40px; text-align: center; }

.th-lyrics .ly-cur { width: 100%; font-size: calc(40px * var(--fs)); font-weight: 750; letter-spacing: -.01em; line-height: 1.2; }
.th-lyrics .ly-curt { display: inline-block; padding: 0 4px; white-space: nowrap; }
.ly-off .th-lyrics .ly-curt, .ly-line .th-lyrics .ly-curt { background: none; color: var(--ink); }
.th-lyrics .ly.no-ly .ly-curt { background: none; color: var(--ink); }

.th-lyrics.v-single .ly-curt { display: inline; white-space: normal; }
.th-lyrics.v-single .ly.no-ly .ly-next { display: block; }
/* TV subtitles */
.th-lyrics.v-subtitle .ly { height: 120px; overflow: visible; background: none; }
.th-lyrics.v-subtitle [data-bg], .th-lyrics.v-subtitle [data-ambient], .th-lyrics.v-subtitle .ly-foot, .th-lyrics.v-subtitle .ly-prev, .th-lyrics.v-subtitle .ly-next { display: none; }
.th-lyrics.v-subtitle .ly-lines { height: 120px; }
.th-lyrics.v-subtitle .ly-cur { width: auto; max-width: 100%; font-family: var(--font-body); font-size: calc(34px * var(--fs)); font-weight: 600; padding: 6px 18px; background: rgba(0,0,0,.8); border-radius: 6px; filter: none !important; overflow: hidden; }
.th-lyrics.v-subtitle .ly-curt { color: #fff; padding: 0; }
.ly-karaoke .th-lyrics.v-subtitle .ly-curt { background: linear-gradient(90deg, #ffe066 0 calc(var(--k,0) * 100%), #fff calc(var(--k,0) * 100%) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.th-lyrics.v-subtitle .ly.no-ly .ly-next { display: none; }
`,
    init(el) { el._ly = { prev: el.querySelector(".ly-prev"), cur: el.querySelector(".ly-curt"), curBox: el.querySelector(".ly-cur"), next: el.querySelector(".ly-next") }; },
    track(el, api) { fill(el, api, api.lyrics, false); },
    enrich(el, api) { fill(el, api, api.lyrics, false); },
    lyric(el, api, st) { fill(el, api, st, true); },
    frame(el, api) { if (!api.lyrics && !el.querySelector(".ly.no-ly")) fill(el, api, null, false); }
  });
})();

  vizOpts: (el) => ({ barW: el._mode === "line" ? 6 : 9, gap: 4 }),
  frame(el, api) {
    const c = el.querySelector(".vz-ring"); if (!c) return;
    const { ctx: g, w, h, dpr } = api.sizeCanvas(c);
    g.clearRect(0, 0, w, h);
    const n = 72, b = api.bands(n / 2), cx = w / 2, cy = h * (170 / 340), r0 = 94 * dpr, len = 70 * dpr;
    g.lineCap = "round"; g.lineWidth = 4.2 * dpr;
    const acc = api.colors.accent;
    for (let i = 0; i < n; i++) {
      const k = i < n / 2 ? i : n - 1 - i; const v = Math.max(.05, b[k]);
      const a = (i / n) * Math.PI * 2 - Math.PI / 2;
      const x1 = cx + Math.cos(a) * r0, y1 = cy + Math.sin(a) * r0, x2 = cx + Math.cos(a) * (r0 + len * v), y2 = cy + Math.sin(a) * (r0 + len * v);
      g.strokeStyle = api.rgba(acc, .45 + v * .55);
      g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
    }
  }
});
